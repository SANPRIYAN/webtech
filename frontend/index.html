<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <title>Student Management</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 30px;
            color: #222;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #2457a7;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            cursor: pointer;
            background-color: #2457a7;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background-color: #1d4585;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
        }

        th {
            background-color: #dbeafe;
        }

        td, th {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        .delete-btn {
            background-color: #dc2626;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }

        .message {
            color: #15803d;
            font-weight: bold;
        }
    </style>
</head>

<body ng-controller="MainController">

<div class="container">
    <h2>Student Management System</h2>

    <form ng-submit="addRecord()">
        <input type="text"
               ng-model="formData.name"
               placeholder="Student Name" required>

        <input type="text"
               ng-model="formData.department"
               placeholder="Department" required>

        <input type="number"
               ng-model="formData.age"
               placeholder="Age" required>

        <button type="submit">Add Student</button>
    </form>

    <p class="message">{{message}}</p>

    <input type="text"
           ng-model="searchText"
           placeholder="Search students">

    <button ng-click="getRecords()">Refresh</button>

    <table>
        <tr>
            <th>Name</th>
            <th>Department</th>
            <th>Age</th>
            <th>Action</th>
        </tr>

        <tr ng-repeat="s in records | filter:searchText">
            <td>{{s.name}}</td>
            <td>{{s.department}}</td>
            <td>{{s.age}}</td>
            <td>
                <button class="delete-btn" ng-click="deleteRecord(s._id)">
                    Delete
                </button>
            </td>
        </tr>
    </table>
</div>

<script>
var app = angular.module("myApp", []);

app.controller("MainController", function($scope, $http) {

    $scope.formData = {};
    $scope.records = [];
    $scope.message = "";

    var API = "http://localhost:5000/api/records";

    // CREATE
    $scope.addRecord = function() {
        $http.post(API, $scope.formData)
        .then(function(response) {
            $scope.message = response.data.message;
            $scope.formData = {};
            $scope.getRecords();
        }, function() {
            $scope.message = "Error adding record";
        });
    };

    // READ
    $scope.getRecords = function() {
        $http.get(API)
        .then(function(response) {
            $scope.records = response.data;
        }, function() {
            $scope.message = "Error fetching records";
        });
    };

    // DELETE
    $scope.deleteRecord = function(id) {
        $http.delete(API + "/" + id)
        .then(function(response) {
            $scope.message = response.data.message;
            $scope.getRecords();
        }, function() {
            $scope.message = "Error deleting record";
        });
    };

    // Load existing records on startup
    $scope.getRecords();

});
</script>

</body>
</html>
